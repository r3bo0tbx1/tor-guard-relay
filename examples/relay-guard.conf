Nickname MyTorGuardRelay
ContactInfo email:your-email[]example.com pgp:YOUR_PGP_FINGERPRINT url:https://example.com proof:uri-familyid-ed25519 ciissversion:3

# Happy Family (Tor 0.4.9.2-alpha or later) - keep MyFamily during transition
# Generate with: docker exec tor-relay gen-family MyRelays
#FamilyId YOUR_FAMILY_ID_HERE

# MyFamily (legacy - keep BOTH during transition period)
# Once Tor Project announces MyFamily removal, you can drop these lines
#MyFamily FINGERPRINT_OF_OTHER_RELAY_1
#MyFamily FINGERPRINT_OF_OTHER_RELAY_2

Address YOUR.IPV4.IP.ADDRESS
ORPort 9001 IPv4Only
ORPort [YOUR:IPV6:IP:ADDRESS::]:9001
DirPort 0
ExitRelay 0
IPv6Exit 0
ExitPolicy reject *:*
PublishServerDescriptor 1
NumCPUs 1
MaxMemInQueues 1024 MB
AvoidDiskWrites 1
DisableDebuggerAttachment 1
RelayBandwidthRate 10 MBytes
RelayBandwidthBurst 20 MBytes
HardwareAccel 1
Sandbox 1
SafeLogging 1
DataDirectory /var/lib/tor
Log notice file /var/log/tor/notices.log
Log notice stdout
ControlPort 0
ControlSocket /var/lib/tor/control_socket
ControlSocketsGroupWritable 1
#HashedControlPassword 16:YOUR_HASHED_PASSWORD_HERE
SocksPort 0
# Tor 0.4.9.15+ DoS defenses: keep the network-consensus defaults.
# Leave DoSBeginDirRateEnabled, DoSBeginDirRate, DoSBeginDirBurst and
# DoSBeginDirDefenseType unset; do not copy fixed thresholds into torrc.
# DoSBeginDirLimitEnabled is a consensus parameter, not a torrc option.
# After upgrading, review/remove a temporary DirCache 0 attack workaround.
# Upgrade and migration details: docs/releases/v2.2.1.md
