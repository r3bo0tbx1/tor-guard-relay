name: ✅⌛
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  source:
    name: 🔍 Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
      - name: 🔍 Lint workflow contracts
        uses: raven-actions/actionlint@v2.2.0
      - name: 🐋 Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: 🐋 Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.edge
          failure-threshold: error
      - name: 🧰 Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml age
      - name: 🔍 Source checks and regression tests
        run: |
          python3 scripts/release/check-versions.py
          python3 scripts/testing/check-dependency-pins.py
          python3 scripts/testing/check-templates.py
          python3 scripts/testing/check-docs.py
          shellcheck -S warning -x docker-entrypoint.sh healthcheck.sh lib/*.sh tools/* scripts/utilities/relay-backup.sh scripts/utilities/relay-inventory.sh
          python3 -m unittest discover -s tests -v
      - name: 🟢 Prepare supported Node runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: 🧩 Validate Renovate schema and dependency policy behavior
        env:
          npm_config_engine_strict: 'true'
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("build/security-tools.json"))["renovate"])')
          tool_root="$RUNNER_TEMP/relay-renovate"
          npm install --prefix "$tool_root" --ignore-scripts --package-lock=false --no-audit --no-fund "renovate@$version"
          npm rebuild --prefix "$tool_root" re2
          node "$tool_root/node_modules/renovate/dist/config-validator.js" --no-global --strict .github/renovate.json
          node scripts/testing/check-renovate.mjs "$tool_root/node_modules/renovate"
      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: 🐋 Verify ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, edge]
        arch: [amd64, arm64]
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
      - name: 🌐 Prepare cross-platform emulation
        uses: docker/setup-qemu-action@v4.4.0
      - name: 🏗️ Prepare image builder
        uses: docker/setup-buildx-action@v4.4.1
      - name: 🐋 Build local candidate image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.variant == 'edge' && 'Dockerfile.edge' || 'Dockerfile' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: relay-test:local
          build-args: |
            BUILD_VERSION=2.2.0-candidate
            SOURCE_REVISION=${{ github.sha }}
      - name: 🧪 Image acceptance
        run: |
          python3 scripts/testing/image-acceptance.py relay-test:local --platform linux/${{ matrix.arch }}
          python3 scripts/testing/check-image.py relay-test:local
      - name: 🛡️ Check Go vulnerabilities in matching source and transport
        run: python3 scripts/testing/check-go-vulns.py --arch ${{ matrix.arch }} --image relay-test:local --output govulncheck.json
      - name: 🔐 Rehearse encrypted recovery
        if: matrix.variant == 'stable' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update && sudo apt-get install -y age
          python3 scripts/testing/recovery-rehearsal.py --image relay-test:local --bind-parent "$RUNNER_TEMP"
      - name: 🛡️ Scan candidate vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relay-test:local
          version: v0.75.0
          format: json
          output: trivy.json
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: 🛡️ Enforce security policy
        run: python3 scripts/testing/check-security.py trivy.json
      - name: 📎 Retain security diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: validation-security-${{ matrix.variant }}-${{ matrix.arch }}
          overwrite: true
          path: |
            trivy.json
            govulncheck*.json
          retention-days: 30

      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  required-checks:
    name: ${{ matrix.check }}
    needs: [source, image]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: ['🏗️ Build Docker Image', '🧪 Integration Tests', '🛡️ Security Scan']
    steps:
      - name: 🚦 Require every candidate check to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$IMAGE_RESULT" = success
      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
          } >> "$GITHUB_STEP_SUMMARY"
