name: 🚀✨
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing release tag to rebuild (empty = latest stable tag)'
        default: ''
        type: string
      publish:
        description: 'Publish validated candidates'
        default: false
        type: boolean
  schedule:
    - cron: '30 18 * * 0'
    - cron: '0 12 */3 * *'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      release: ${{ steps.source.outputs.release }}
      build_date: ${{ steps.source.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: source
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.source_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          release=false
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
            publish=true
            release=true
          else
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              tag=$(git tag --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}')
            fi
            if [ "$EVENT" = schedule ] || [ "$INPUT_PUBLISH" = true ]; then publish=true; fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          {
            echo "sha=$sha"
            echo "version=${tag#v}"
            echo "publish=$publish"
            echo "release=$release"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  source-validation:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y age shellcheck
      - name: Validate selected release source
        run: |
          python3 scripts/release/check-versions.py
          python3 scripts/testing/check-docs.py
          python3 scripts/testing/check-templates.py
          shellcheck -S warning -x docker-entrypoint.sh healthcheck.sh lib/*.sh tools/* scripts/utilities/relay-backup.sh scripts/utilities/relay-inventory.sh
          python3 -m unittest discover -s tests -v

  candidate:
    needs: [source, source-validation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, edge]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate source and templates
        run: |
          python3 scripts/release/check-versions.py
          python3 scripts/testing/check-templates.py
      - name: Build once into local candidate
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.variant == 'edge' && 'Dockerfile.edge' || 'Dockerfile' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: relay-candidate:${{ matrix.variant }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.source.outputs.version }}
            BUILD_DATE=${{ needs.source.outputs.build_date }}
            SOURCE_REVISION=${{ needs.source.outputs.sha }}
      - name: Offline behavioral acceptance
        run: python3 scripts/testing/image-acceptance.py relay-candidate:${{ matrix.variant }}-${{ matrix.arch }} --platform linux/${{ matrix.arch }}
      - name: Enforce component security floors
        run: python3 scripts/testing/check-image.py relay-candidate:${{ matrix.variant }}-${{ matrix.arch }}
      - name: Rehearse encrypted recovery with both storage layouts
        if: matrix.variant == 'stable' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update && sudo apt-get install -y age
          python3 scripts/testing/recovery-rehearsal.py --image relay-candidate:stable-amd64 --bind-parent "$RUNNER_TEMP"
      - name: Scan exact candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relay-candidate:${{ matrix.variant }}-${{ matrix.arch }}
          version: v0.75.0
          format: json
          output: trivy.json
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Enforce security policy without hiding advisory findings
        run: python3 scripts/testing/check-security.py trivy.json
      - name: Generate SBOMs from the exact candidate
        env:
          IMAGE: relay-candidate:${{ matrix.variant }}-${{ matrix.arch }}
        run: |
          mkdir sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/reports" anchore/syft:v1.54.1 \
            "docker:$IMAGE" -o spdx-json=/reports/sbom.spdx.json -o cyclonedx-json=/reports/sbom.cdx.json
      - name: Export validated candidate and evidence
        env:
          IMAGE: relay-candidate:${{ matrix.variant }}-${{ matrix.arch }}
        run: |
          docker image inspect "$IMAGE" > image.json
          docker save "$IMAGE" -o image.tar
          sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-${{ matrix.variant }}-${{ matrix.arch }}
          overwrite: true
          path: |
            image.tar
            image.tar.sha256
            image.json
            trivy.json
            sbom/*.json
          retention-days: 7

  publish:
    needs: [source, candidate]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: candidate-*
          path: candidates
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote validated images without rebuilding
        env:
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for variant in stable edge; do
            suffix=""
            alias=latest
            if [ "$variant" = edge ]; then suffix=-edge; alias=edge; fi
            for registry in "r3bo0tbx1/onion-relay" "ghcr.io/$OWNER/onion-relay"; do
              references=()
              for arch in amd64 arm64; do
                directory="candidates/candidate-$variant-$arch"
                (cd "$directory" && sha256sum -c image.tar.sha256)
                docker load -i "$directory/image.tar"
                local_image="relay-candidate:$variant-$arch"
                expected=$(jq -r '.[0].Id' "$directory/image.json")
                test "$(docker image inspect "$local_image" --format '{{.Id}}')" = "$expected"
                stage="$registry:validated-${SOURCE:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$variant-$arch"
                docker tag "$local_image" "$stage"
                docker push "$stage"
                digest=$(docker image inspect "$stage" --format '{{join .RepoDigests "\n"}}' | grep "^$registry@" | tail -n 1)
                test -n "$digest"
                references+=("$digest")
              done
              docker buildx imagetools create -t "$registry:$VERSION$suffix" -t "$registry:$alias" "${references[@]}"
              docker buildx imagetools inspect "$registry:$VERSION$suffix" > "published-$variant-$(echo "$registry" | tr / _).txt"
            done
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: published-manifests
          overwrite: true
          path: published-*.txt

  notes:
    needs: [source, publish]
    if: needs.source.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - name: Select curated release notes
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          test -s "docs/releases/v$VERSION.md"
          cp "docs/releases/v$VERSION.md" release-notes.md
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: candidate-*
          path: evidence
      - name: Package component and security evidence
        run: |
          tar -czf release-evidence.tar.gz --exclude=image.tar --exclude=image.tar.sha256 -C evidence .
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          tag_name: v${{ needs.source.outputs.version }}
          files: release-evidence.tar.gz
