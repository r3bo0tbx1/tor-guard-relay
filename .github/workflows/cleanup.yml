name: Registry retention review
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List registry versions for manual retention review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --paginate "users/$OWNER/packages/container/onion-relay/versions" > ghcr-versions.json
          curl --fail --silent --show-error "https://hub.docker.com/v2/repositories/r3bo0tbx1/onion-relay/tags/?page_size=100" > dockerhub-tags.json
          echo "Read-only inventory. Preserve current aliases, version manifests, their architecture digests and the verified rollback set before any manual deletion."
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-retention-review
          path: |
            ghcr-versions.json
            dockerhub-tags.json
