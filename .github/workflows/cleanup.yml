name: 🗑️🧹
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inventory, tidy publishing tags, or preview/apply removal of retired 2.0.0 and 2.1.0 images'
        type: choice
        default: inventory
        options: [inventory, tidy-v2.2.0, prune-old-plan, prune-old-apply]
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  tidy-release:
    name: 🏷️ Tidy v2.2.0 registry tags
    if: inputs.operation == 'tidy-v2.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: registry-publishing
      cancel-in-progress: false
    steps:
      - name: 📥 Check out maintenance source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Install verified registry client
        run: python3 scripts/release/install-regctl.py
      - name: 🔑 Authenticate Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🔑 Authenticate GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🛡️ Plan tag-only cleanup before changing either registry
        env:
          SOURCE: 4a87b4308bfa5b61922f1b506594819379f77922
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/release/tidy-release-tags.py --registry r3bo0tbx1/onion-relay \
            --version 2.2.0 --source "$SOURCE" --output dockerhub-cleanup-plan.json
          python3 scripts/release/tidy-release-tags.py --registry "ghcr.io/$OWNER/onion-relay" \
            --version 2.2.0 --source "$SOURCE" --output ghcr-cleanup-plan.json
      - name: 🧹 Remove unwanted tags and verify retained release manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: 4a87b4308bfa5b61922f1b506594819379f77922
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/release/tidy-release-tags.py --registry r3bo0tbx1/onion-relay \
            --version 2.2.0 --source "$SOURCE" --output dockerhub-cleanup-result.json --apply
          python3 scripts/release/tidy-release-tags.py --registry "ghcr.io/$OWNER/onion-relay" \
            --version 2.2.0 --source "$SOURCE" --output ghcr-cleanup-result.json --apply
      - name: 🧅 Refresh branded Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release/sync-dockerhub-overview.py
      - name: 📎 Retain cleanup plans and verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-tag-cleanup
          path: |
            *-cleanup-*.json
            dockerhub-overview-before.json
          retention-days: 30
  prune-old:
    name: 🧹 Retire older registry images
    if: inputs.operation == 'prune-old-plan' || inputs.operation == 'prune-old-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: registry-publishing
      cancel-in-progress: false
    steps:
      - name: 📥 Check out reviewed maintenance source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🧰 Install verified registry client
        run: python3 scripts/release/install-regctl.py
      - name: 🔑 Authenticate Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🔑 Authenticate GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🛡️ Require completed publication and its successful audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/check-retention-ready.py --repository "$REPOSITORY" --output retention-readiness.json
      - name: 🛡️ Preview retired images or apply verified removal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          args=()
          if [ "$OPERATION" = prune-old-apply ]; then args+=(--apply); fi
          python3 scripts/release/prune-old-images.py --owner "$OWNER" --keep-version 2.2.0 \
            --remove-version 2.0.0 --remove-version 2.1.0 \
            --publication-evidence retention-publication/published-manifests.json \
            --output retention-result.json "${args[@]}"
      - name: 🧅 Refresh registry overview after retirement
        if: inputs.operation == 'prune-old-apply'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release/sync-dockerhub-overview.py
      - name: 📎 Retain readiness, deletion plan and preservation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-retirement
          path: |
            retention-readiness.json
            retention-result.json
            retention-publication/published-manifests.json
            dockerhub-overview-before.json
          retention-days: 30
  inventory:
    name: 🗂️ Review registry retention
    runs-on: ubuntu-latest
    steps:
      - name: 🗂️ List registry versions for manual retention review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "users/$OWNER/packages/container/onion-relay/versions?per_page=100" --jq 'add' > ghcr-versions.json
          curl --fail --silent --show-error "https://hub.docker.com/v2/repositories/r3bo0tbx1/onion-relay/tags/?page_size=100" > dockerhub-tags.json
          echo "Read-only inventory. Preserve current aliases, version manifests, their architecture digests and the verified rollback set before any manual deletion."
      - name: 📎 Retain build evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-retention-review
          path: |
            ghcr-versions.json
            dockerhub-tags.json
      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
          } >> "$GITHUB_STEP_SUMMARY"
