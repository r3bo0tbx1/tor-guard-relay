name: 🔒🧅
on:
  workflow_dispatch:
    inputs:
      tor_version:
        description: 'Exact stable Tor version to authenticate; blank discovers the latest release'
        type: string
        required: false
        default: ''
  workflow_run:
    workflows: ['🚀✨']
    types: [completed]
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'build/**'
      - 'scripts/testing/**'
      - 'scripts/release/update-tor-source.py'
      - 'scripts/release/propose-tor-update.py'
      - '.github/renovate.json'
      - '.github/workflows/security.yml'
permissions:
  contents: read
  packages: read
concurrency:
  group: security-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tor-upstream:
    name: 🧅 Watch stable Tor releases
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tor_version == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
      - name: 🔎 Detect and authenticate newer stable Tor source
        run: python3 scripts/release/update-tor-source.py --proposal-only --output tor-upstream.json
      - name: 📎 Retain upstream status and any authenticated proposed pin
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tor-upstream
          path: tor-upstream.json
          overwrite: true
          retention-days: 30

  tor-request:
    name: 🧅 Validate requested Tor release
    needs: published
    if: always() && github.event_name == 'workflow_dispatch' && inputs.tor_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 📚 Collect this run's installed Tor identities
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: watched-*-*-*
          path: published-assessments
      - name: 🔐 Authenticate the exact release and reject downgrades
        env:
          TOR_VERSION: ${{ inputs.tor_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/release/update-tor-source.py --proposal-only --version "$TOR_VERSION" \
            --published-reports published-assessments --owner "$OWNER" --output tor-upstream.json
      - name: 📎 Retain the source request and verification result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tor-upstream
          path: tor-upstream.json
          overwrite: true
          retention-days: 30

  tor-update-pr:
    name: 📝 Maintain the Tor source update PR
    needs: [tor-upstream, tor-request, published]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.tor-upstream.result == 'success' || needs.tor-request.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out the assessed main revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 📚 Collect the authenticated source proposal
        uses: actions/download-artifact@v8.0.2
        with:
          name: tor-upstream
          path: ${{ runner.temp }}/tor-update
      - name: 🔎 Check whether the source proposal needs image evidence
        id: proposal
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tor-update/tor-upstream.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(report.get('update_available') is True).lower() + '\n')
          PY
      - name: 📚 Collect this run's installed Tor identities
        if: steps.proposal.outputs.changed == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: watched-*-*-*
          path: ${{ runner.temp }}/tor-update/images
      - name: 🛡️ Check the proposal against the reviewed pin and published images
        id: prepare
        run: |
          python3 scripts/release/propose-tor-update.py --repository "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/tor-update/tor-upstream.json" \
            --published-reports "$RUNNER_TEMP/tor-update/images" --plan "$RUNNER_TEMP/tor-update/plan.json"
      - name: 🔑 Check GitHub App configuration
        if: steps.prepare.outputs.ready == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.TOR_UPDATE_APP_CLIENT_ID }}
        run: |
          if [ -z "$APP_CLIENT_ID" ]; then
            echo '::error::Configure TOR_UPDATE_APP_CLIENT_ID and TOR_UPDATE_APP_PRIVATE_KEY to open Tor update PRs. The authenticated proposal is available in the tor-upstream artifact.'
            exit 1
          fi
      - name: 🔑 Get a repository-scoped GitHub App token
        if: steps.prepare.outputs.ready == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOR_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOR_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: 📝 Open or refresh the single draft proposal
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          python3 scripts/release/propose-tor-update.py --repository "$GITHUB_REPOSITORY" \
            --plan "$RUNNER_TEMP/tor-update/plan.json" --app-slug "$APP_SLUG"

  source:
    name: 🛡️ Go source (${{ matrix.arch }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
      - name: 🧭 Verify native source-analysis host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker version --format '{{.Server.Arch}}')" = "$EXPECTED_ARCH"
      - name: 🏗️ Prepare image builder
        uses: docker/setup-buildx-action@v4.4.1
      - name: 🔍 Check source and metadata pins
        run: python3 scripts/testing/check-dependency-pins.py
      - name: 🛡️ Check current source and independently maintained Go graph
        run: python3 scripts/testing/check-go-vulns.py --arch ${{ matrix.arch }} --output govulncheck.json
      - name: 📎 Retain source assessment
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: watched-go-${{ matrix.arch }}
          overwrite: true
          path: govulncheck*.json
          retention-days: 30

      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
            if [ "$EVENT_NAME" = push ]; then
              printf '\n🔎 This main update checks current source. Published images are audited every six hours, on manual dispatch, and after a successful release workflow. Existing published-image findings remain unresolved until replacement digests pass that audit.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  published:
    name: 🐋 Published images
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        registry: [dockerhub, ghcr]
        variant: [stable, edge]
        arch: [amd64, arm64]
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
      - name: 🌐 Prepare cross-platform version checks
        uses: docker/setup-qemu-action@v4.4.0
      - name: 🏗️ Prepare image builder
        uses: docker/setup-buildx-action@v4.4.1
      - name: 🔑 Authenticate GHCR
        uses: docker/login-action@v4.7.0
        if: matrix.registry == 'ghcr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔎 Resolve and retain the exact published architecture digest
        id: image
        env:
          REGISTRY: ${{ matrix.registry }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository=r3bo0tbx1/onion-relay
          if [ "$REGISTRY" = ghcr ]; then repository="ghcr.io/${OWNER,,}/onion-relay"; fi
          alias=latest
          if [ "$VARIANT" = edge ]; then alias=edge; fi
          reference="$repository:$alias"
          docker buildx imagetools inspect "$reference" --raw > manifest.json
          digest=$(jq -er --arg arch "$ARCH" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Expected one architecture manifest") end' manifest.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$repository@$digest"
          echo "$image" > image-reference.txt
          docker pull --platform "linux/$ARCH" "$image"
          docker image inspect "$image" > image.json
          echo "reference=$image" >> "$GITHUB_OUTPUT"
      - name: ✨ Scan published digest using current advisory data
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          version: v0.76.1
          format: json
          output: trivy.json
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: ✨ Assess published image using current policy
        run: python3 scripts/testing/check-security.py trivy.json --image-metadata image.json --summary "$GITHUB_STEP_SUMMARY"
      - name: 🛡️ Enforce the current Tor minimum on the published digest
        if: always() && steps.image.outcome == 'success'
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          python3 scripts/testing/check-image.py "$IMAGE" --tor-only --summary "$GITHUB_STEP_SUMMARY" > tor-version.json
      - name: 📎 Retain published assessment
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: watched-${{ matrix.registry }}-${{ matrix.variant }}-${{ matrix.arch }}
          overwrite: true
          path: |
            manifest.json
            image-reference.txt
            image.json
            trivy.json
            tor-version.json
          retention-days: 30
      - name: 📋 Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.job }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            printf '## 🧅 Relay workflow evidence\n\n'
            printf '| Detail | Value |\n| --- | --- |\n'
            printf '| Job | <code>%s</code> |\n' "$JOB_NAME"
            printf '| Outcome | **%s** |\n' "$JOB_STATUS"
            printf '| Workflow revision | <code>%s</code> |\n' "$SOURCE_REVISION"
            printf '\n📎 Consult the retained artifacts and preceding gate results for detailed evidence.\n'
          } >> "$GITHUB_STEP_SUMMARY"
